name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # bash scripts on real bash: ubuntu (bash 5), macOS (/bin/bash 3.2, BSD tools), Windows (Git Bash)
  bash:
    name: bash (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux and zsh (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux zsh
      - name: Install tmux (macOS; zsh is /bin/zsh)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install tmux || brew install tmux
      - name: Put /bin first so nested bash is 3.2 (macOS)
        if: runner.os == 'macOS'
        run: echo /bin >> "$GITHUB_PATH"
      - name: Assert bash 3.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          test "$(command -v bash)" = /bin/bash
          /bin/bash -c 'case "$BASH_VERSION" in 3.2*) exit 0;; *) echo "bash $BASH_VERSION"; exit 1;; esac'
      - name: Env summary (informational)
        run: |
          uname -a || true
          bash --version | head -1 || true
          docker --version || true
          python3 --version || true
          node --version || true
          tmux -V || true
          zsh --version || true
          shellcheck --version || true
      - name: Lint
        run: /bin/bash tests/lint.sh
        env:
          GUYB_REQUIRE_SHELLCHECK: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Smoke
        run: /bin/bash tests/smoke.sh
        env:
          GUYB_RO_FULL: ${{ runner.os != 'Windows' && '1' || '' }}
      - name: Secrets guard
        run: /bin/bash tests/secrets.sh
      - name: Tabs (launcher colour and title lock; real tmux and zsh)
        run: /bin/bash tests/tabs.sh
        env:
          GUYB_REQUIRE_TMUX: ${{ runner.os != 'Windows' && '1' || '' }}
          GUYB_REQUIRE_ZSH: ${{ runner.os != 'Windows' && '1' || '' }}
      - name: Status line
        run: /bin/bash tests/statusline.sh
      - name: Hooks under dash
        run: /bin/bash tests/hooks-sh.sh
        env:
          GUYB_REQUIRE_DASH: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Setup check path expansion
        run: /bin/bash tests/setup-paths.sh

  # PowerShell 7 on all three OSes
  pwsh:
    name: pwsh 7 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: ./tests/lint.ps1
      - name: Smoke
        run: ./tests/smoke.ps1
      - name: Secrets guard
        run: ./tests/secrets.ps1
      - name: Tabs (launcher colour and title lock)
        run: ./tests/tabs.ps1
      - name: Status line
        run: ./tests/statusline.ps1
      - name: Permission rules
        run: ./tests/permissions.ps1
      - name: Setup check path expansion
        run: ./tests/setup-paths.ps1
      - name: Windows launcher (shim, PATH helpers)
        run: ./tests/winlauncher.ps1

  # Windows PowerShell 5.1 (the shell older Windows machines still use)
  winps51:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Lint
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/lint.ps1
      - name: Smoke
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/smoke.ps1
      - name: Secrets guard
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/secrets.ps1
      - name: Tabs (launcher colour and title lock)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/tabs.ps1
      - name: Status line
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/statusline.ps1
      - name: Permission rules
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/permissions.ps1
      - name: Setup check path expansion
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/setup-paths.ps1
      - name: Windows launcher (shim, PATH helpers)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/winlauncher.ps1

  # Plugin manifest validation. Not part of ci-ok yet: it installs Claude Code from npm and may need
  # network or auth. Make it required by adding it to ci-ok's needs once it has been green for a while.
  validate:
    name: claude plugin validate (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296 # pinned; bump deliberately
      - name: Validate plugin
        run: claude plugin validate ./plugins/guyb

  # Single check to require in branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [bash, pwsh, winps51]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        run: |
          echo "bash=${{ needs.bash.result }} pwsh=${{ needs.pwsh.result }} winps51=${{ needs.winps51.result }}"
          test "${{ needs.bash.result }}" = success
          test "${{ needs.pwsh.result }}" = success
          test "${{ needs.winps51.result }}" = success
